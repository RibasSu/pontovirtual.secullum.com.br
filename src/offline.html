<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto Virtual Secullum - Sem internet</title>
    <style>
      :root {
        color-scheme: light;
        --brand-color: #ffcc1a;
        --brand-ink: #25200a;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f5f7fb;
        color: #20242c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at top left, rgba(255, 204, 26, 0.22), transparent 34rem),
          linear-gradient(135deg, #f9fbff 0%, #eef3f8 100%);
      }

      main {
        width: min(100%, 460px);
        padding: 32px;
        border: 1px solid #dce4ee;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 44px rgba(32, 36, 44, 0.10);
      }

      .mark {
        width: 48px;
        height: 48px;
        margin-bottom: 24px;
        border-radius: 8px;
        object-fit: contain;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #5d6776;
        font-size: 16px;
        line-height: 1.55;
      }

      button {
        width: 100%;
        min-height: 44px;
        margin-top: 28px;
        border: 0;
        border-radius: 6px;
        background: var(--brand-color);
        color: var(--brand-ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .status {
        min-height: 22px;
        margin-top: 14px;
        color: #7a4350;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="./icon.png" alt="Ponto Virtual Secullum">
      <h1>Conecte o app à internet</h1>
      <p>
        O Ponto Virtual Secullum precisa de conexão para carregar. Verifique o Wi-Fi,
        cabo de rede ou VPN e tente novamente.
      </p>
      <button id="retry" type="button">Tentar novamente</button>
      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script>
      const retryButton = document.querySelector('#retry');
      const statusText = document.querySelector('#status');

      retryButton.addEventListener('click', async () => {
        retryButton.disabled = true;
        statusText.textContent = 'Verificando conexão...';

        const connected = await window.pontoVirtualDesktop.retryConnection();

        if (!connected) {
          retryButton.disabled = false;
          statusText.textContent = 'Ainda sem conexão. Conecte o computador à internet e tente novamente.';
        }
      });
    </script>
  </body>
</html>
